services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:${REDPANDA_KAFKA_PORT:-19092}
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr
      - internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:${REDPANDA_KAFKA_PORT:-19092}"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - stream-net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.1
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "${REDPANDA_CONSOLE_PORT:-18080}:8080"
    networks:
      - stream-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stream_ads}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - stream-net

  redis:
    image: redis:7.2-alpine
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - stream-net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-03-26T22-10-45Z
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-19010}:9000"
      - "${MINIO_CONSOLE_PORT:-19011}:9001"
    volumes:
      - minio-data:/data
    networks:
      - stream-net

  mc:
    image: quay.io/minio/mc:RELEASE.2024-03-30T15-29-52Z
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_started
    networks:
      - stream-net

  flink-jobmanager:
    image: apache/flink:1.19.1-scala_2.12-java17
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-flink-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
    ports:
      - "${FLINK_JOBMANAGER_PORT:-18081}:8081"
    volumes:
      - flink-state:/opt/flink/state
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - stream-net

  flink-taskmanager:
    image: apache/flink:1.19.1-scala_2.12-java17
    container_name: ${PROJECT_NAME:-stream-ads-analytics}-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
    volumes:
      - flink-state:/opt/flink/state
    networks:
      - stream-net

volumes:
  redpanda-data:
  clickhouse-data:
  redis-data:
  minio-data:
  flink-state:

networks:
  stream-net:
    name: ${PROJECT_NAME:-stream-ads-analytics}-net
